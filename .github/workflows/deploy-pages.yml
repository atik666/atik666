name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Ensure the workflow token has rights to create Pages deployments
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          set -e
          if [ -f bun.lockb ]; then
            echo "bun.lockb found; attempting frozen install"
            if ! bun install --frozen-lockfile; then
              echo "Frozen install failed; retrying without --frozen-lockfile"
              bun install
            fi
          else
            echo "bun.lockb not found; running plain 'bun install'"
            bun install
          fi

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          OUTPUT_DIR="./docs"
          if [ ! -d "$OUTPUT_DIR" ]; then
            echo "Error: $OUTPUT_DIR not found."
            echo "Make sure your build outputs to $OUTPUT_DIR or change the 'Upload artifact' path."
            exit 1
          fi
          echo "Contents of $OUTPUT_DIR (first 50 files):"
          find "$OUTPUT_DIR" -maxdepth 2 -type f | head -n 50

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
